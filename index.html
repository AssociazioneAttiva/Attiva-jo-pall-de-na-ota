<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JO PALLO' DE NA 'OTA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass-card { background: rgba(30, 41, 59, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .accent-gradient { background: linear-gradient(135deg, #10b981 0%, #059669 100%); }
    </style>
</head>
<body class="min-h-screen flex flex-col pb-12">

    <!-- SCHERMATA LOGIN -->
    <div id="login-modal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md z-[100] flex items-center justify-center p-4">
        <div class="glass-card max-w-md w-full p-8 rounded-2xl border border-slate-700/80 shadow-2xl space-y-6">
            <div class="text-center space-y-2">
                <div class="w-12 h-12 rounded-2xl accent-gradient flex items-center justify-center text-white shadow-lg mx-auto">
                    <i class="fa-solid fa-trophy text-2xl"></i>
                </div>
                <h2 class="text-2xl font-bold text-white uppercase tracking-wide">JO PALLO' DE NA 'OTA</h2>
                <p class="text-xs text-slate-400">Accedi per gestire o consultare il torneo</p>
            </div>

            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Nome Utente</label>
                    <input type="text" id="login-user" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white text-sm focus:border-emerald-500 focus:outline-none" placeholder="Inserisci username">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Password</label>
                    <input type="password" id="login-pass" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white text-sm focus:border-emerald-500 focus:outline-none" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full py-3.5 rounded-xl accent-gradient font-bold text-white shadow-lg hover:opacity-95 transition">
                    Accedi
                </button>
            </form>

            <div class="relative flex py-1 items-center">
                <div class="flex-grow border-t border-slate-800"></div>
                <span class="flex-shrink mx-4 text-xs text-slate-500">oppure</span>
                <div class="flex-grow border-t border-slate-800"></div>
            </div>

            <button onclick="guestLogin()" class="w-full py-3 rounded-xl bg-slate-800 border border-slate-700 text-xs font-semibold text-slate-300 hover:text-white hover:bg-slate-700/50 transition">
                Entra come Spettatore (Sola Lettura)
            </button>
        </div>
    </div>

    <!-- APP PRINCIPALE -->
    <header class="border-b border-slate-800 bg-slate-900/80 sticky top-0 z-50 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl accent-gradient flex items-center justify-center text-white shadow-lg">
                    <i class="fa-solid fa-trophy text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-xl tracking-tight text-white uppercase">JO PALLO' DE NA 'OTA</h1>
                    <p class="text-xs text-slate-400" id="badge-mode">In attesa di accesso...</p>
                </div>
            </div>

            <div class="flex items-center gap-3">
                <nav class="flex flex-wrap bg-slate-800/80 p-1 rounded-xl border border-slate-700/50">
                    <button onclick="switchTab('form')" id="tab-form" class="admin-only flex items-center gap-2 px-3 py-2 rounded-lg text-xs font-medium bg-emerald-500 text-white shadow">
                        <i class="fa-solid fa-pen-to-square"></i> Inserisci Voto
                    </button>
                    <button onclick="switchTab('standings')" id="tab-standings" class="flex items-center gap-2 px-3 py-2 rounded-lg text-xs font-medium text-slate-400 hover:text-white">
                        <i class="fa-solid fa-trophy"></i> Classifiche
                    </button>
                    <button onclick="switchTab('log')" id="tab-log" class="flex items-center gap-2 px-3 py-2 rounded-lg text-xs font-medium text-slate-400 hover:text-white">
                        <i class="fa-solid fa-list-check"></i> Registro Voti
                    </button>
                </nav>

                <button onclick="logout()" class="p-2.5 rounded-xl bg-slate-800 text-slate-400 hover:text-rose-400 border border-slate-700/50 text-xs" title="Esci">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6 flex-grow w-full">

        <!-- FORM ADMIN -->
        <section id="section-form" class="admin-only space-y-6">
            <div class="glass-card rounded-2xl p-6 space-y-6 max-w-2xl mx-auto">
                <h2 class="text-xl font-bold text-white border-b border-slate-700/60 pb-3">Nuovo Voto</h2>
                <form id="voto-form" onsubmit="salvaVoto(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Squadra</label>
                        <input type="text" id="input-squadra" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white text-sm" placeholder="Es. Team A">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Giocatore</label>
                        <input type="text" id="input-giocatore" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white text-sm" placeholder="Nome Giocatore">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Punti Voto / Bonus</label>
                        <input type="number" id="input-punti" step="0.5" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white text-sm" placeholder="Es. 6.5 o 3">
                    </div>
                    <button type="submit" class="w-full py-4 rounded-xl accent-gradient font-bold text-white shadow-lg">
                        Invia e Aggiorna Live
                    </button>
                </form>
            </div>
        </section>

        <!-- CLASSIFICA -->
        <section id="section-standings" class="space-y-6">
            <h2 class="text-2xl font-bold text-white uppercase">Classifica Live</h2>
            <div class="glass-card rounded-2xl overflow-hidden border border-slate-700/50">
                <table class="w-full text-left text-sm text-slate-300">
                    <thead class="bg-slate-900/90 text-xs text-slate-400 uppercase">
                        <tr>
                            <th class="px-6 py-4">Pos</th>
                            <th class="px-6 py-4">Squadra</th>
                            <th class="px-6 py-4 text-right">Punti Totali</th>
                        </tr>
                    </thead>
                    <tbody id="standings-body" class="divide-y divide-slate-800/60"></tbody>
                </table>
            </div>
        </section>

        <!-- LOG -->
        <section id="section-log" class="hidden space-y-6">
            <h2 class="text-2xl font-bold text-white">Registro Voti Inseriti</h2>
            <div class="glass-card rounded-2xl overflow-hidden border border-slate-700/50">
                <table class="w-full text-left text-sm text-slate-300">
                    <thead class="bg-slate-900/90 text-xs text-slate-400 uppercase">
                        <tr>
                            <th class="px-4 py-3">Squadra</th>
                            <th class="px-4 py-3">Giocatore</th>
                            <th class="px-4 py-3 text-right">Punti</th>
                            <th class="px-4 py-3 text-right admin-only">Azione</th>
                        </tr>
                    </thead>
                    <tbody id="log-body" class="divide-y divide-slate-800/60"></tbody>
                </table>
            </div>
        </section>

    </main>

    <script>
        // CONFIGURAZIONE CREDENZIALI
        const ADMIN_USER = "admin";
        const ADMIN_PASS = "pass123";

        // CONFIGURAZIONE JSONBIN
        const BIN_ID = "INSERISCI_QUI_IL_TUO_BIN_ID";
        const MASTER_KEY = "INSERISCI_QUI_LA_TUA_MASTER_KEY";

        let currentRole = null; // 'admin' o 'guest'
        let appData = { voti: [] };

        function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('login-user').value.trim();
            const p = document.getElementById('login-pass').value.trim();

            if (u === ADMIN_USER && p === ADMIN_PASS) {
                initSession('admin');
            } else {
                alert("Credenziali errate!");
            }
        }

        function guestLogin() {
            initSession('guest');
        }

        function initSession(role) {
            currentRole = role;
            document.getElementById('login-modal').classList.add('hidden');
            setupPermissions();
            caricaDatiOnline();
            setInterval(caricaDatiOnline, 8000);
        }

        function logout() {
            location.reload();
        }

        function setupPermissions() {
            const badge = document.getElementById('badge-mode');
            if (currentRole === 'admin') {
                badge.innerText = "Modalità Amministratore";
                badge.className = "text-xs text-emerald-400 font-bold";
                document.querySelectorAll('.admin-only').forEach(el => el.style.display = '');
                switchTab('form');
            } else {
                badge.innerText = "Modalità Spettatore (Sola Lettura)";
                badge.className = "text-xs text-amber-400 font-bold";
                document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'none');
                switchTab('standings');
            }
        }

        async function caricaDatiOnline() {
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { "X-Master-Key": MASTER_KEY }
                });
                const data = await res.json();
                if(data.record && data.record.voti) {
                    appData = data.record;
                    render();
                }
            } catch (e) {
                console.error("Errore caricamento", e);
            }
        }

        async function salvaVoto(e) {
            e.preventDefault();
            if (currentRole !== 'admin') return;

            const squadra = document.getElementById('input-squadra').value.trim();
            const giocatore = document.getElementById('input-giocatore').value.trim();
            const punti = parseFloat(document.getElementById('input-punti').value) || 0;

            appData.voti.push({ id: Date.now(), squadra, giocatore, punti });

            await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                method: 'PUT',
                headers: {
                    "Content-Type": "application/json",
                    "X-Master-Key": MASTER_KEY
                },
                body: JSON.stringify(appData)
            });

            document.getElementById('voto-form').reset();
            render();
            alert("Voto salvato!");
        }

        async function eliminaVoto(id) {
            if (currentRole !== 'admin') return;
            if(!confirm("Sicuro di voler eliminare questo voto?")) return;

            appData.voti = appData.voti.filter(v => v.id !== id);

            await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                method: 'PUT',
                headers: {
                    "Content-Type": "application/json",
                    "X-Master-Key": MASTER_KEY
                },
                body: JSON.stringify(appData)
            });

            render();
        }

        function render() {
            // Render Log
            const logBody = document.getElementById('log-body');
            logBody.innerHTML = appData.voti.map(v => `
                <tr class="hover:bg-slate-800/40">
                    <td class="px-4 py-3 font-medium text-white">${v.squadra}</td>
                    <td class="px-4 py-3 text-slate-300">${v.giocatore}</td>
                    <td class="px-4 py-3 text-right font-bold text-emerald-400">+${v.punti}</td>
                    <td class="px-4 py-3 text-right admin-only">
                        <button onclick="eliminaVoto(${v.id})" class="text-rose-400 hover:text-rose-300"><i class="fa-solid fa-trash"></i></button>
                    </td>
                </tr>
            `).join('');

            // Classifica
            const classifica = {};
            appData.voti.forEach(v => {
                classifica[v.squadra] = (classifica[v.squadra] || 0) + v.punti;
            });

            const classificaOrdinata = Object.keys(classifica)
                .map(sq => ({ squadra: sq, punti: classifica[sq] }))
                .sort((a,b) => b.punti - a.punti);

            const standingsBody = document.getElementById('standings-body');
            standingsBody.innerHTML = classificaOrdinata.map((item, idx) => `
                <tr class="hover:bg-slate-800/40">
                    <td class="px-6 py-4 font-bold text-slate-400">#${idx + 1}</td>
                    <td class="px-6 py-4 font-semibold text-white">${item.squadra}</td>
                    <td class="px-6 py-4 text-right font-black text-emerald-400">${item.punti} pt</td>
                </tr>
            `).join('');

            setupPermissions();
        }

        function switchTab(tab) {
            ['form', 'standings', 'log'].forEach(t => {
                const sec = document.getElementById(`section-${t}`);
                const tabBtn = document.getElementById(`tab-${t}`);
                if(sec) sec.classList.add('hidden');
                if(tabBtn) tabBtn.className = 'flex items-center gap-2 px-3 py-2 rounded-lg text-xs font-medium text-slate-400 hover:text-white';
            });

            document.getElementById(`section-${tab}`).classList.remove('hidden');
            document.getElementById(`tab-${tab}`).className = 'flex items-center gap-2 px-3 py-2 rounded-lg text-xs font-medium bg-emerald-500 text-white shadow';
        }
    </script>
</body>
</html>
